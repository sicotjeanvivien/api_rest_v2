[workspace]
members = ["domain", "application", "infra", "interface", "bootstrap"]
resolver = "2"

[workspace.dependencies]
serde = { version = "*", features = ["derive"] }
serde_json = "*"
thiserror = "*"
anyhow = "*"
tokio = { version = "*", features = ["full"] }
chrono = { version = "*", features = ["serde"] }
sqlx = { version = "*", features = [
  "postgres",
  "runtime-tokio",
  "macros",
  "chrono",
] }
async-trait = "*"
dotenvy = "*"
tracing = "*"
tracing-subscriber = "*"
argon2 = "*"
jsonwebtoken = "8"

[workspace.dev-dependencies]
sqlx = { version = "*", features = [
  "postgres",
  "runtime-tokio",
  "macros",
  "migrate",
  "chrono",
] }
